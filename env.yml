name: scb
channels: [pytorch, nvidia, conda-forge]
dependencies:
  - python=3.11
  - pytorch>=2.5
  - pytorch-cuda
  - torchvision
  - pip
  - pip:
      - timm==1.0.*
      - transformers>=4.46,<6
      - open-clip-torch
      - pandas>=2.2
      - scikit-learn>=1.5
      - matplotlib
      - seaborn
      - wandb
      - hydra-core==1.3.*
      - omegaconf
      - tqdm
      - pyyaml
      - pydicom
      - pillow
      - wfdb
      - h5py
      - opencv-python
      - grad-cam
      - ruff
      - pytest
      - jupyter
